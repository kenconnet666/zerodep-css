name: 生产验收

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MUP_DIST: '1'
  CSS_PROBE_BROWSER_CHANNEL: chromium

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: 'false'
          research: 'false'
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm lsp:verify

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - run: pnpm test:author
      - run: pnpm test:theme
      - run: pnpm test:bindings
      - run: pnpm test:compiler
      - run: pnpm --dir test/tools test:compiler-instances
      - run: pnpm --dir test/tools test:keyword-variants
      - run: pnpm --dir test/tools test:vfor-style
      - run: pnpm --dir test/tools test:mup:server
      - run: pnpm --dir test/tools test:mup:exports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-coverage
          path: test-results/runtime-coverage.lcov

  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    env:
      CSS_PROBE_BROWSER_CHANNEL: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: ${{ matrix.browser }}
      - run: pnpm --dir test/tools test:selectors
      - run: pnpm --dir test/tools test:mup:browser
      - run: pnpm --dir test/tools test:mup:hydration
      - run: pnpm --dir test/tools test:examples:browser
      - run: pnpm --dir test/tools test:examples:hydration
      - run: pnpm --dir test/tools test:transport
      - run: pnpm --dir test/tools test:author-api
      - run: pnpm --dir test/tools test:bindings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: test-results/bx-bindings/

  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        framework: [vue, svelte]
    runs-on: ubuntu-latest
    env:
      CSS_TEST_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: chromium
      - run: pnpm test:lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-${{ matrix.framework }}
          path: test-results/lifecycle-*.json

  metaframework:
    strategy:
      fail-fast: false
      matrix:
        framework: [nuxt, sveltekit]
    runs-on: ubuntu-latest
    env:
      CSS_TEST_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: chromium
      - run: node scripts/prepare-framework-fixtures.mjs
      - if: matrix.framework == 'nuxt'
        run: node ../../node_modules/nuxt/bin/nuxt.mjs build
        working-directory: nuxt/test/app
      - if: matrix.framework == 'sveltekit'
        run: node ../../node_modules/vite/bin/vite.js build
        working-directory: sveltekit/test/app
      - run: pnpm --dir test/tools test:metaframeworks

  performance:
    strategy:
      fail-fast: false
      matrix:
        suite: [bindings-200, bindings-1000, author, templates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: chromium
      - if: startsWith(matrix.suite, 'bindings-')
        run: pnpm --dir test/tools probe:bindings
        env:
          BINDING_ROUNDS: '3'
          BINDING_ROWS: ${{ matrix.suite == 'bindings-1000' && '1000' || '200' }}
      - if: matrix.suite == 'author'
        run: |
          pnpm --dir test/tools probe:static-fields
          pnpm --dir test/tools probe:keywords
      - if: matrix.suite == 'templates'
        run: |
          pnpm --dir test/tools probe:template-derived
          pnpm --dir test/tools probe:template-conditional
          pnpm --dir test/tools probe:vfor-style
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.suite }}
          path: |
            test-results/binding-performance/
            test-results/keyword-representation/
            test-results/template-derived/
            test-results/template-conditional/
            test-results/vfor-style/

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: 'false'
          research: 'false'
      - run: pnpm audit --prod --audit-level=high
