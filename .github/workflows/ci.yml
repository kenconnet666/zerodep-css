name: 基础工作区检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm lsp:verify

  integration:
    runs-on: ubuntu-latest
    env:
      CSS_PROBE_BROWSER_CHANNEL: chromium
      MUP_DIST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir .research/string-css-probe install --frozen-lockfile
      - run: pnpm --dir .research/string-css-probe exec playwright install --with-deps chromium
      - run: pnpm --filter @zerodep-css/core test
      - run: pnpm test:author
      - run: pnpm test:bindings
      - run: pnpm --dir .research/string-css-probe probe:static-fields
      - run: pnpm --dir .research/string-css-probe test:selectors
      - run: pnpm --dir .research/string-css-probe test:mup:browser
      - run: pnpm --dir .research/string-css-probe test:mup:server
      - run: pnpm --dir .research/string-css-probe test:mup:hydration
      - run: pnpm --dir .research/string-css-probe test:mup:exports
      - run: pnpm --dir .research/string-css-probe test:examples:browser
      - run: pnpm --dir .research/string-css-probe test:examples:hydration
      - run: pnpm --dir .research/string-css-probe test:transport
      - run: pnpm --dir .research/string-css-probe test:author-api
      - run: pnpm --dir .research/string-css-probe test:bindings
      - run: node test/browser/lifecycle-hmr.mjs
      - run: pnpm --dir .research/string-css-probe probe:bindings
        env:
          BINDING_ROUNDS: '1'
      - run: node scripts/prepare-framework-fixtures.mjs
      - run: node ../../node_modules/nuxt/bin/nuxt.mjs build
        working-directory: nuxt/test/app
      - run: node ../../node_modules/vite/bin/vite.js build
        working-directory: sveltekit/test/app
      - run: pnpm --dir .research/string-css-probe test:metaframeworks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-diagnostics
          path: |
            test-results/lifecycle-hmr.json
            test-results/binding-performance/results.json
