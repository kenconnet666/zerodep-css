packages:
  - core
  - vue
  - svelte
  - nuxt
  - sveltekit

catalog:
  '@types/node': 24.13.5
  '@nuxt/kit': 4.5.2
  '@sveltejs/kit': 2.70.3
  '@sveltejs/adapter-node': 5.5.7
  '@sveltejs/vite-plugin-svelte': 7.3.0
  csstype: 3.2.3
  magic-string: 1.4.2
  esbuild: 0.28.2
  nuxt: 4.5.2
  prettier: 3.9.7
  prettier-plugin-svelte: 4.1.1
  svelte: 5.57.0
  svelte-check: 4.7.6
  typescript: 6.0.3
  vite: 8.3.0
  vue: 3.5.43

catalogs:
  languageServices:
    '@modelcontextprotocol/sdk': 1.30.0
    '@vue/language-server': 3.3.11
    '@vue/typescript-plugin': 3.3.11
    svelte-language-server: 0.18.4
    typescript-language-server: 6.0.0
    typescript-svelte-plugin: 0.3.52
    vscode-jsonrpc: 8.2.1
    vue-tsc: 3.3.11
